checks:
- id: color-parity
  section: color
  ok: true
  detail: كل المتغيرات اللونية النهارية مطابقة
- id: font-family
  section: type
  ok: true
  detail: عائلة Cairo مذكورة في أنماط المشروع
- id: motion-included
  section: motion
  ok: false
  detail: ظهور الرمز غير مضمَّن في الواجهة
  action: استورد identity/motion.css وطبّق الصنف sima-mark-intro على الرمز عند أول ظهور.
- id: slide-templates
  section: applications
  ok: false
  detail: قوالب الشرائح غير موجودة في المشروع
  action: ابنِ قالب شرائح 16:9 من identity/applications/slide-*.svg.
- id: splash-screen
  section: applications
  ok: false
  detail: شاشة الافتتاح غير موجودة في المشروع
  action: ابنِ شاشة افتتاح من identity/applications/app-splash.svg.
- id: token-parity-test
  section: tokens
  ok: false
  detail: اختبار تطابق الرموز مع ADOPTION.yaml غير موجود
  action: اكتب اختبارًا يقرأ token_map من ADOPTION.yaml ويطابقه مع tokens.css.
gaps:
- motion-included
- slide-templates
- splash-screen
- token-parity-test
