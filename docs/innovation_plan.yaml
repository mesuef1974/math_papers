    wave: W2
    goal: نتيجة بطاقة الخروج تقترح تعديل تذكّر الغد وافتتاحه، والمعلم يعتمد بضغطة.
    depends: [M1.2]
    milestones:
      - id: M5.1
        title: اقتراح تعديل تحضير الحصة التالية من أنواع الأخطاء
        done_when: اختبار يثبت أن بنود التذكّر المقترحة من الأمثلة التي أخطأ فيها أكثر الصف، حتميًا بالبذرة.
        probes:
          - {path: apps/planning/tests/test_adaptive_prep.py, has: test_recall_targets_top_errors}
        cards: []
      - id: M5.2
        title: اعتماد المعلم أو رفضه يُحفظ ويدخل العرض والتحضير في Word
        done_when: الاقتراح المعتمد يظهر في شريحة التذكّر وملف Word، والمرفوض لا يُعاد اقتراحه للحصة نفسها.
        probes:
          - {path: apps/planning/tests/test_adaptive_prep.py, has: test_approved_suggestion_reaches_deck}
        cards: []
    kpis:
      - {key: adaptive_suggestions_approved_pct, title: اقتراحات التعديل التي اعتمدها المعلم, unit: "%", baseline: null, target: 60}
    decisions: []
    risks:
      - اقتراحات كثيرة تُهمَل، فالحد اقتراح واحد لكل حصة.

  - id: M6
    title: حزمة المعلم البديل
    wave: W2
    goal: طلب واحد يُخرج حزمة حصة مكتفية بذاتها لمن يغطّيها.
    depends: []
    milestones:
      - id: M6.1
        title: مهمة خلفية تجمع تحضيرًا مختصرًا وعرضًا وورقة ومفتاحًا في ملف واحد
        done_when: الحزمة تُبنى لأي حصة لها تحضير، ومفتاحها مشتق من مدخلاتها فإعادة الطلب تعيد الملف نفسه.
        probes:
          - {path: apps/planning/tests/test_cover_pack.py, has: test_pack_key_is_stable}
        cards: []
      - id: M6.2
        title: زر الحزمة في صفحة الحصة
        done_when: المعلم ينزّل الحزمة من صفحة الحصة والحارس البصري أخضر.
        probes:
          - {path: frontend/src/stores/coverPack.ts}
        cards: []
    kpis:
      - {key: cover_pack_seconds_p95, title: زمن بناء الحزمة (المئين 95), unit: ث, baseline: null, target: 60, lower_is_better: true}
    decisions: []
    risks: []

  - id: M7
    title: تصحيح بالكاميرا
    wave: W3
    goal: المعلم يصوّر ورقة الإجابة فتُصحَّح موضوعياتها وتُسجَّل باسم الطالب.
    depends: [M1.2]
    milestones:
      - id: M7.1
        title: رمز على الورقة يحمل وصفتها (البذرة والنموذج والطالب) موقّعًا
        done_when: الرمز يُقرأ من PDF وWord فيعيد الوصفة نفسها، والرمز المعدَّل يُرفض بالتوقيع.
        probes:
          - {path: apps/papers/tests/test_sheet_code.py, has: test_tampered_code_is_rejected}
        cards: []
      - id: M7.2
        title: قراءة دوائر الإجابة من الصورة مهمة خلفية بلا تخزين الصورة
        done_when: دقة 99% فأعلى على مجموعة اختبار من 200 ورقة مصوَّرة، والورقة غير الواضحة تُحال للمعلم ولا تُخمَّن.
        probes:
          - {path: apps/papers/tests/test_sheet_reader.py, has: test_accuracy_on_reference_set}
        cards: []
      - id: M7.3
        title: صفحة التصوير في الهاتف ومراجعة ما أُحيل
        done_when: معلم يصحّح شعبة من هاتفه، والنتائج تدخل جدول نتائج البنود نفسه.
        probes:
          - {path: frontend/src/pages/ScanPage.vue}
        cards: []
    kpis:
      - {key: scan_accuracy_pct, title: دقة قراءة الإجابات, unit: "%", baseline: null, target: 99}
      - {key: scan_referred_pct, title: أوراق أُحيلت للمراجعة اليدوية, unit: "%", baseline: null, target: 5, lower_is_better: true}
    decisions:
      - {text: تجربة أولى على ورقة اختيار من متعدد وحدها قبل أي استثمار في المقالي, status: open}
      - {text: مكتبة قراءة الصور تدخل ملف الأقفال، فطلبها يدمجه المالك يدويًا, status: open}
    risks:
      - أعلى مخاطرة تقنية في الخطة، فالمعلَم M7.2 بوابة تُلغى المبادرة إن لم تبلغ دقته.
      - صورة الورقة بيانات شخصية، فتُعالج في الذاكرة وتُحذف ولا تُرفع إلى التخزين.

  - id: M8
    title: سياق قطري مولَّد
    wave: W3
    goal: مسائل لفظية أصلية من قوالب سياق محلية بأرقام واقعية المدى.
    depends: []
    milestones:
      - id: M8.1
        title: طبقة قوالب السياق فوق الصيغ العددية
        done_when: القالب يأخذ أعداد الصيغة ولا يغيّر جوابها، ويثبته فحص عددي لكل قالب.
        probes:
          - {path: apps/papers/tests/test_contexts.py, has: test_context_keeps_answer}
        cards: []
      - id: M8.2
        title: 30 قالبًا معتمدًا من المالك موزَّعة على وحدات العاشر
        done_when: اختبار يعدّ القوالب المعتمدة ومدى أرقام كل قالب ضمن حدوده المعلنة.
        probes:
          - {path: apps/papers/tests/test_contexts.py, has: test_thirty_approved_contexts}
        cards: []
    kpis:
      - {key: approved_contexts, title: قوالب سياق معتمدة, unit: قالب, baseline: 0, target: 30}
    decisions:
      - {text: اعتماد المالك لصياغة كل قالب قبل ظهوره للمعلمين, status: open}
    risks:
      - صياغة تشبه مسألة في الكتاب، فكل قالب يُكتب أصليًا ولا يُنقل من أي مصدر.

  - id: M9
    title: دفتر ولي الأمر
    wave: W4
    goal: رسالة أسبوعية لكل طالب بما أتقنه وما يحتاجه وورقة قصيرة مولَّدة له.
    depends: [M2.2]
    milestones:
      - id: M9.1
        title: سجل موافقة ولي الأمر وحق السحب
        done_when: لا تقرير يُبنى لطالب بلا موافقة مسجَّلة، وسحبها يوقف الإرسال ويُسجَّل في AuditLog.
        probes:
          - {path: apps/planning/tests/test_guardian_consent.py, has: test_no_report_without_consent}
        cards: []
      - id: M9.2
        title: تقرير الطالب الأسبوعي PDF يسلّمه المعلم
        done_when: التقرير يُبنى بمهمة خلفية من نتائج الأسبوع، وورقته من خمس مسائل علاجية.
        probes:
          - {path: apps/planning/tests/test_guardian_report.py, has: test_weekly_report_from_results}
        cards: []
    kpis:
      - {key: guardian_reports_with_consent_pct, title: تقارير صدرت بموافقة مسجَّلة, unit: "%", baseline: null, target: 100}
    decisions:
      - {text: قناة التسليم (ورق يحمله الطالب أم قناة المدرسة الرسمية) وموافقة إدارة المدرسة, status: open}
    risks:
      - إرسال آلي لأولياء الأمور خارج قناة المدرسة مخالفة محتملة، فالمرحلة الأولى PDF بيد المعلم وحده.

  - id: M10
    title: تعدد المدارس
    wave: W4
    goal: مدرسة ثانية تعمل على المنصة معزولة ببياناتها وقالبها، ومنسّق المادة يقارن شعبه.
    depends: [M4.1]
    milestones:
      - id: M10.1
        title: نموذج المدرسة وعزل بيانات المعلمين والطلاب بها
        done_when: اختبار يثبت أن معلم مدرسة لا يقرأ شعبة ولا نتيجة ولا ورقة محفوظة من مدرسة أخرى في كل المسارات.
