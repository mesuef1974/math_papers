# خطة مبادرات المنصة: المصدر الوحيد. الوثيقة docs/innovation_plan.md تُولَّد منه ولا تُعدَّل يدويًا:
#   python scripts/plan_status.py --write
# القياس آلي: المعلَم «منجز» حين تنجح كل مجسّاته (probes) وتُدمج كل بطاقاته (cards).
#   probe: {path: <ملف>}            الملف موجود
#   probe: {path: <ملف>, has: <نص>} الملف موجود ويحوي النص (اسم اختبار مثلًا)
# مؤشرات الأثر (kpis) تُقرأ من docs/innovation_metrics.json الذي يكتبه أمر plan_metrics (المبادرة M0).
# depends يقبل معرّف مبادرة (كلها منجزة) أو معرّف معلَم.
# التواريخ مقترحة ويعدّلها المالك هنا وحده.

version: 1
title: خطة مبادرات المنصة
started: 2026-11-25
metrics_file: docs/innovation_metrics.json

principles:
  - كل مسألة تُولَّد أصليًا وكل مولّد جديد له فحص عددي مستقل (نطاق المحتوى).
  - بيانات الطلاب قاصرون تحت PDPPL، فأقل بيانات ممكنة، وكل قراءة وكتابة في AuditLog، ولا صورة ورقة تُخزَّن.
  - كل هجرة expand/contract تُراجَع بشريًا، وما يتجاوز 300ms مهمة خلفية idempotent.
  - لا تبدأ مبادرة قبل إنجاز ما تعتمد عليه، ولا يُعدّ معلَم منجزًا إلا بمجسّه.

waves:
  - {id: W1, title: حلقة التشخيص والعلاج, due: 2026-12-24}
  - {id: W2, title: الاختبار والحصة المتكيّفة, due: 2027-01-28}
  - {id: W3, title: إغلاق حلقة الورق, due: 2027-03-04}
  - {id: W4, title: خارج الصف, due: 2027-04-15}

initiatives:
  - id: M0
    title: القياس
    wave: W1
    goal: مؤشرات الأثر تُحسب من قاعدة الإنتاج بأمر واحد وتدخل هذه الخطة بلا إدخال يدوي.
    depends: []
    milestones:
      - id: M0.1
        title: أمر plan_metrics يكتب مؤشرات الخطة JSON من الجداول بـ ORM
        done_when: تشغيله مرتين على قاعدة لم تتغير يعطي الملف نفسه، وكل مفتاح مؤشر في هذه الخطة موجود فيه.
        probes:
          - {path: apps/core/management/commands/plan_metrics.py}
          - {path: apps/core/tests/test_plan_metrics.py, has: test_metrics_are_idempotent}
        cards: ["20261125-5289eb"]
      - id: M0.2
        title: المشغّل يحدّث وثيقة الخطة بعد كل مزامنة للدفتر
        done_when: دمج بطاقة يغيّر حالة معلَمها في الوثيقة بلا تدخل.
        probes:
          - {path: automation/runner.py, has: plan_status}
        cards: []
    kpis: []
    decisions:
      - {text: ربط التحديث بالمشغّل تعديل على automation/runner.py وهو محظور على الدمج الآلي فيدمجه المالك يدويًا, status: open}
    risks:
      - قراءة قاعدة الإنتاج من جهاز المالك تحتاج النفق المشفّر لا الوصول العام.

  - id: M1
    title: تشخيص الخطأ لا الدرجة
    wave: W1
    goal: كل إجابة خاطئة تسمّي سوء الفهم، والمعلم يرى الصف بأنواع الأخطاء لا بالمتوسط.
    depends: []
    milestones:
      - id: M1.1
        title: وسم مشتتات كل الصيغ الموضوعية بنوع الخطأ
        done_when: test_error_kinds.py يحرس توازي wrong_kinds مع wrong لكل صيغ المقررين.
        probes:
          - {path: apps/papers/tests/test_error_kinds.py}
          - {path: apps/papers/domain/item_bank.py}
        cards: []
      - id: M1.2
        title: نتيجة الطالب لكل بند (الطالب والبند والخيار المختار ونوع خطئه)
        done_when: نموذج بهجرة expand، وإدخال نتائج شعبة يُسجَّل في AuditLog، وطلب معلم آخر لها يعيد 403.
        probes:
          - {path: apps/planning/tests/test_student_results.py, has: test_other_teacher_gets_403}
        cards: ["20261125-c03df9"]
      - id: M1.3
        title: لوحة سوء الفهم للشعبة والدرس
        done_when: اللوحة تعرض عدد الطلاب لكل نوع خطأ وأسماءهم، واختبار يطابق أعدادها بالبيانات المدخلة.
        probes:
          - {path: apps/planning/tests/test_misconception_board.py, has: test_counts_match_results}
          - {path: frontend/src/pages/MisconceptionsPage.vue}
        cards: ["20261125-055945"]
      - id: M1.4
        title: إدخال نتائج الطلاب من الواجهة
        done_when: المعلم يدخل اختيارات شعبته في بنود بطاقة الخروج نفسها فتظهر في لوحة سوء الفهم، بلا تخزين أسماء في المتصفح.
        probes:
          - {path: apps/planning/tests/test_result_entry.py, has: test_entry_items_match_exit_ticket}
          - {path: frontend/src/pages/ResultsEntryPage.vue}
        cards: ["20261125-184413"]
    kpis:
      - {key: tagged_objective_formulas_pct, title: الصيغ الموضوعية الموسومة, unit: "%", baseline: 100, target: 100}
      - {key: results_with_error_kind_pct, title: إجابات خاطئة مسجَّلة بنوع خطأ, unit: "%", baseline: 0, target: 90}
    decisions:
      - {text: "هوية الطالب رقم قيد واسم مختصر، والاحتفاظ حتى نهاية العام الدراسي ثم حذف آلي مع بقاء الأعداد المجمَّعة (المالك 2026-11-25)", status: decided}
    risks:
      - نوع خطأ لا يطابق تفكير الطالب فعلًا، فيُراجَع التصنيف على عيّنة أوراق حقيقية قبل اعتماد اللوحة.

  - id: M2
    title: ورقة علاجية لكل طالب
    wave: W1
    goal: بعد كل كوز تخرج لكل طالب ورقة من أخطائه هو بأرقام مختلفة ومفتاح واحد للمعلم.
    depends: [M1.2]
    milestones:
      - id: M2.1
        title: خدمة تبني وصفة ورقة من أنواع أخطاء الطالب
        done_when: اختبار عددي يثبت أن كل جزء في الورقة يقيس مثالًا أخطأ فيه الطالب، والبذرة تعيد الورقة نفسها.
        probes:
          - {path: apps/papers/tests/test_remedial.py, has: test_parts_target_student_errors}
        cards: ["20261125-ec58d5"]
      - id: M2.2
        title: حزمة الشعبة مهمة خلفية (PDF واحد وصفحة لكل طالب ومفتاح مجمَّع)
        done_when: شعبة من 30 طالبًا تُبنى بمهمة idempotent، وإعادتها لا تنشئ ملفًا ثانيًا.
        probes:
          - {path: apps/papers/tests/test_remedial.py, has: test_class_pack_is_idempotent}
        cards: ["20261126-332353"]
      - id: M2.3
        title: زر «أوراق علاجية» في لوحة سوء الفهم
        done_when: المعلم ينزّل الحزمة من اللوحة، والحارس البصري أخضر للصفحة.
        probes:
          - {path: frontend/src/stores/remedial.ts}
        cards: []
    kpis:
      - {key: remedial_coverage_pct, title: طلاب أخطؤوا وصدرت لهم ورقة علاجية, unit: "%", baseline: 0, target: 80}
      - {key: remedial_pack_seconds_p95, title: زمن بناء حزمة الشعبة (المئين 95), unit: ث, baseline: null, target: 60, lower_is_better: true}
    decisions: []
    risks:
      - درس بلا صيغ كافية لمثال بعينه، فتُملأ الورقة من أقرب مثال في الدرس ويُذكر ذلك في المفتاح.

  - id: M3
    title: مسألة «اكتشف الخطأ»
    wave: W1
    goal: نوع مولّد يعرض حلًّا كاملًا فيه خطأ واحد مزروع، والمطلوب تحديده وتصحيحه.
    depends: [M1.1]
    milestones:
      - id: M3.1
        title: نوع المسألة في المجال وفحصه العددي
        done_when: الفحص يثبت أن الخطوة الموسومة وحدها خاطئة وأن تصحيحها يعيد الجواب الصحيح.
        probes:
          - {path: apps/papers/tests/test_generators.py, has: test_error_spotting}
        cards: ["20261125-4786ec"]
      - id: M3.2
        title: تغطية دروس العاشر الممتحَنة بصيغة واحدة على الأقل
        done_when: اختبار يعدّ الدروس الممتحَنة التي لها صيغة اكتشف الخطأ ويساويها بعددها.
        probes:
          - {path: apps/papers/tests/test_grade10.py, has: test_every_examinable_lesson_has_error_spotting}
        cards: ["20261125-b413ee", "20261125-9fac4a", "20261125-a96fb6", "20261125-53e6dd"]
      - id: M3.3
        title: عرضها في الورقة والمفتاح وWord
        done_when: الحل المعروض يظهر مرقَّم الخطوات في الشاشة وPDF وWord، والمفتاح يذكر رقم الخطوة ونوع الخطأ.
        probes:
          - {path: frontend/src/components/ErrorSpottingPart.vue}
        cards: []
    kpis:
      - {key: lessons_with_error_spotting, title: دروس ممتحَنة لها صيغة اكتشف الخطأ, unit: درس, baseline: 0, target: 14}
    decisions:
      - {text: مستوى DOK المعتمد لهذا النوع وهل يدخل الاختبارات أم أوراق العمل وحدها, status: open}
    risks: []

  - id: M4
    title: توأم الاختبار وخريطة الجاهزية
    wave: W2
    goal: لكل شعبة خريطة تبيّن أي خانة في جدول المواصفات ما زالت ضعيفة، وخطة مراجعة مولَّدة تسدّها.
    depends: [M1.2]
    milestones:
      - id: M4.1
        title: خريطة الجاهزية (خانة الجدول × الشعبة) من نتائج البنود
        done_when: اختبار يطابق نسبة كل خانة ببيانات مدخلة، والخانة بلا بيانات تظهر «لم تُقَس» لا صفرًا.
        probes:
          - {path: apps/planning/tests/test_readiness.py, has: test_cell_rates_match_results}
        cards: []
      - id: M4.2
        title: خطة مراجعة مولَّدة من الخانات الضعيفة
        done_when: الخطة توزّع الحصص المتاحة قبل الاختبار على الخانات بوزن درجتها وضعفها، وتحترم التقويم.
        probes:
          - {path: apps/planning/tests/test_readiness.py, has: test_review_plan_respects_calendar}
        cards: []
      - id: M4.3
        title: صفحة الجاهزية وتنزيل اختبار تجريبي مطابق للجدول
        done_when: المعلم يرى الخريطة وينزّل اختبارًا بأوزان الجدول ومستوياته من الصفحة نفسها.
        probes:
          - {path: frontend/src/pages/ReadinessPage.vue}
        cards: []
    kpis:
      - {key: blueprint_cells_measured_pct, title: خانات الجدول المقيسة قبل الاختبار بأسبوعين, unit: "%", baseline: 0, target: 90}
    decisions: []
    risks:
      - جدول مواصفات لم تكتمل مولّدات دروسه لا يُعرض للتوليد، فخريطته تبقى للقياس وحده.

  - id: M5
